<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- OpenAI Dots — dot cluster on dark OpenAI background -->
  <rect width="100" height="100" rx="20" fill="#10a37f"/>
  <!-- Three dots in a triangle formation -->
  <circle cx="50" cy="30" r="9" fill="white"/>
  <circle cx="32" cy="62" r="9" fill="white" opacity="0.9"/>
  <circle cx="68" cy="62" r="9" fill="white" opacity="0.9"/>
  <!-- Connection lines -->
  <line x1="50" y1="38" x2="36" y2="54" stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>
  <line x1="50" y1="38" x2="64" y2="54" stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>
  <line x1="40" y1="62" x2="60" y2="62" stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>
</svg>
